<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP AirSync Update</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css">
    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-2xl mx-auto px-4 py-10">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Firmware Update</h1>
        <p class="text-sm text-gray-400 mb-8">Current version: <span class="font-medium text-gray-600">{{FIRMWARE_VERSION}}</span></p>

        <div class="bg-white rounded-2xl shadow-sm p-6 mb-6">
            <h2 class="text-lg font-semibold text-gray-700 mb-1">Install Update</h2>
            <p class="text-sm text-gray-400 mb-5">
                Download the latest release for your <code class="bg-gray-100 px-1 rounded text-xs">{{CHIP_MODEL}}</code> device from the
                <a href="https://github.com/jptrsn/esp-airsync/releases"
                   target="_blank"
                   class="text-blue-500 hover:underline">GitHub releases page</a>,
                then select the binary below.
            </p>
            <div id="upload-form">
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-600 mb-1">Firmware Binary (.bin)</label>
                    <input type="file" id="firmware-file" accept=".bin"
                           class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                </div>
                <button onclick="startUpdate()"
                        class="bg-blue-500 hover:bg-blue-600 text-white text-sm font-medium px-5 py-2 rounded-lg transition-colors">
                    Install Update
                </button>
            </div>

            <div id="progress-section" class="hidden">
                <div class="flex items-center gap-3 mb-3">
                    <svg class="spinner h-5 w-5 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
                    </svg>
                    <span class="text-sm font-medium text-gray-600">Uploading firmware...</span>
                </div>
                <div class="w-full bg-gray-100 rounded-full h-2">
                    <div id="progress-bar" class="bg-blue-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <p id="progress-text" class="text-xs text-gray-400 mt-2">0%</p>
            </div>

            <div id="success-section" class="hidden">
                <div class="flex items-center gap-2 text-green-600">
                    <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                    </svg>
                    <span class="font-medium text-sm">Update complete. Device is restarting...</span>
                </div>
            </div>

            <div id="error-section" class="hidden">
                <div class="flex items-center gap-2 text-red-600">
                    <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                    </svg>
                    <span id="error-message" class="font-medium text-sm">Update failed.</span>
                </div>
                <button onclick="resetForm()"
                        class="mt-4 text-sm text-blue-500 hover:underline">Try again</button>
            </div>
        </div>

        <div class="text-center">
            <a href="/" class="text-sm text-gray-400 hover:text-gray-600">← Back to configuration</a>
        </div>
    </div>

    <script>
        function startUpdate() {
            const file = document.getElementById('firmware-file').files[0];
            if (!file) {
                alert('Please select a firmware file.');
                return;
            }

            document.getElementById('upload-form').classList.add('hidden');
            document.getElementById('progress-section').classList.remove('hidden');

            const xhr = new XMLHttpRequest();

            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    const pct = Math.round((e.loaded / e.total) * 100);
                    document.getElementById('progress-bar').style.width = pct + '%';
                    document.getElementById('progress-text').textContent = pct + '%';
                }
            };

            xhr.onload = function() {
                document.getElementById('progress-section').classList.add('hidden');
                if (xhr.status === 200) {
                    document.getElementById('success-section').classList.remove('hidden');
                } else {
                    document.getElementById('error-message').textContent = 'Update failed: ' + xhr.statusText;
                    document.getElementById('error-section').classList.remove('hidden');
                }
            };

            xhr.onerror = function() {
                document.getElementById('progress-section').classList.add('hidden');
                document.getElementById('error-message').textContent = 'Upload failed. Device may be restarting.';
                document.getElementById('error-section').classList.remove('hidden');
            };

            xhr.open('POST', '/update');
            xhr.setRequestHeader('Content-Type', 'application/octet-stream');
            xhr.send(file);
        }

        function resetForm() {
            document.getElementById('error-section').classList.add('hidden');
            document.getElementById('upload-form').classList.remove('hidden');
            document.getElementById('firmware-file').value = '';
        }
    </script>
</body>
</html>
